name: Copilot final ARM clean install diagnostic
on:
  workflow_dispatch:
    inputs:
      target_branch:
        type: string
        default: codex/copilot-qualified-source46-ui1
permissions: {}
jobs:
  authorize_manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      target_sha: ${{ steps.authorize.outputs.target_sha }}
    steps:
      - name: Authorize an explicit maintainer image build
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ALLOWED_IDS: ${{ vars.AWS_CI_TRUSTED_USER_IDS }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = paperclipai/paperclip
          test "$REPOSITORY_ID" = 1170821064
          jq -e 'type == "array" and length > 0 and all(.[]; type == "number")' <<< "$ALLOWED_IDS" >/dev/null
          triggering_id="$(gh api "users/$TRIGGERING_ACTOR" --jq .id)"
          for id in "$ACTOR_ID" "$triggering_id"; do
            jq -e --argjson id "$id" 'index($id) != null' <<< "$ALLOWED_IDS" >/dev/null
          done
          target_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

  consumer:
    name: Exact final archived packages on macOS ARM
    needs: authorize_manual
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f1e4d852d32a7756ece224bfafc9b2b40a6e2056
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: copilot-v46-ui1-complete-install-20261019-public-packages
          run-id: 39301451518
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/public-runner-packs
      - name: Install unchanged verifier dependencies without lifecycle scripts
        run: pnpm install --ignore-scripts --no-frozen-lockfile
      - name: Run the unchanged verifier with bounded failure-tail observation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f1e4d852d32a7756ece224bfafc9b2b40a6e2056
          test "$(node -p 'process.platform + "-" + process.arch')" = darwin-arm64
          node --input-type=module - --mac-consumer "$RUNNER_TEMP/public-runner-packs" f1e4d852d32a7756ece224bfafc9b2b40a6e2056 "$RUNNER_TEMP/native-public-install.json" <<'NODE'
          try {
            await import('./scripts/verify-grok-npm-install.mjs');
          } catch (error) {
            console.error('UNMODIFIED_VERIFIER_FAILURE', JSON.stringify({code:error.code,status:error.status,signal:error.signal}));
            if (typeof error.stderr === 'string') console.error(error.stderr.slice(-65536));
            if (typeof error.stdout === 'string') console.error(error.stdout.slice(-65536));
            throw error;
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: copilot-v46-ui1-arm-consumer-diagnostic
          path: ${{ runner.temp }}/native-public-install.json
          if-no-files-found: warn
          retention-days: 14
