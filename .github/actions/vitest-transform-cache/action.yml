name: Vitest transform cache
description: Reuse source-validated module transforms while executing every isolated test.
inputs:
  mode:
    description: Restore before tests or save after successful canonical master tests.
    default: restore
  role:
    description: Test group whose module transforms are reusable.
    required: true
  shard:
    description: Preferred producer shard; other shards in the group are fallback sources.
    default: '0'
  verified-ref:
    description: Exact checked-out canonical master revision, required when saving.
    default: ''
outputs:
  cache-hit:
    description: Whether this namespace and shard already have a canonical cache entry.
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Compute transform scope
      id: scope
      shell: bash
      run: node scripts/vitest-transform-cache.mjs

    - name: Restore module transforms
      id: restore
      continue-on-error: true
      if: inputs.mode == 'restore' && steps.scope.outputs.cacheable == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.scope.outputs.directory }}
        key: ${{ steps.scope.outputs.key }}-${{ inputs.role }}-${{ inputs.shard }}
        restore-keys: |
          ${{ steps.scope.outputs.key }}-${{ inputs.role }}-

    - name: Verify canonical producer
      if: >-
        inputs.mode == 'save' && steps.scope.outputs.cacheable == 'true' &&
        github.repository == 'paperclipai/paperclip' && github.repository_id == '1170821064' &&
        github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        github.sha != '' && inputs.verified-ref == github.sha
      shell: bash
      run: test "$(git rev-parse HEAD)" = '${{ github.sha }}'

    - name: Save canonical module transforms
      continue-on-error: true
      if: >-
        inputs.mode == 'save' && steps.scope.outputs.cacheable == 'true' &&
        github.repository == 'paperclipai/paperclip' && github.repository_id == '1170821064' &&
        github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        github.sha != '' && inputs.verified-ref == github.sha
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.scope.outputs.directory }}
        key: ${{ steps.scope.outputs.key }}-${{ inputs.role }}-${{ inputs.shard }}
